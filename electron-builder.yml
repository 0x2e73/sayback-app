appId: ch.sayback.desktop
productName: SayBack
directories:
  output: dist
files:
  - out/**/*
  - package.json
# onlyLoadAppFromAsar and the update channel (hash of app.asar) both depend on it.
asar: true
# Flipped in the Electron binary just before signing. Without a Developer ID the bundle is only
# ad-hoc signed: flipping breaks that signature, so it is redone, or arm64 macOS kills the app.
# `npm run package`, `dist` and `update:publish` then re-sign it with SAYBACK_SIGNING_IDENTITY, if
# set (scripts/local-signing.ts), so that macOS permissions survive updates.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  resetAdHocDarwinSignature: true
mac:
  category: public.app-category.productivity
  # electron-builder never signs: it would pick a Developer ID from the keychain, with hardened
  # runtime and no entitlements, which cuts the microphone. scripts/local-signing.ts signs: as is
  # for local builds, with runtime and build/entitlements.mac.plist for `npm run release`.
  identity: null
  target: [dmg]
  extendInfo:
    NSMicrophoneUsageDescription: Enregistrer votre voix pendant vos réunions.
    NSAudioCaptureUsageDescription: Enregistrer le son de votre ordinateur pendant vos réunions.
    NSScreenCaptureUsageDescription: Relier vos notes au contenu partagé à l’écran.
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
